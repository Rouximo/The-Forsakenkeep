<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Forsaken Keep</title>
<style>
html,body{margin:0;height:100%;background:#050309;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pad{position:fixed;bottom:20vh;display:grid;gap:12px;z-index:5}
.dp{left:max(18px,env(safe-area-inset-left));grid-template-columns:repeat(3,auto)}
.ac{right:max(18px,env(safe-area-inset-right));grid-template-columns:repeat(2,auto)}
.b{width:clamp(56px,12vmin,94px);height:clamp(56px,12vmin,94px);border:2px solid #4dff7a;border-radius:14px;background:rgba(10,6,20,.55);color:#9dffb5;font:bold clamp(13px,2.6vmin,20px) "Courier New",monospace;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 0 12px rgba(77,255,122,.25) inset}
.b.v{border-color:#a35cff;color:#dcc4ff;box-shadow:0 0 12px rgba(163,92,255,.3) inset}
.b.on{background:rgba(77,255,122,.35);transform:scale(.94)}
.b.v.on{background:rgba(163,92,255,.45)}
#pz{position:fixed;top:8px;right:max(10px,env(safe-area-inset-right));z-index:6;width:46px;height:46px;border:2px solid #a35cff;border-radius:10px;background:rgba(10,6,20,.6);color:#dcc4ff;font:bold 18px "Courier New",monospace;touch-action:manipulation}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(30,14,50,.78),rgba(4,2,8,.92));font-family:"Palatino Linotype",Palatino,Georgia,serif;text-align:center;padding:16px}
#menu h1{margin:0;font-size:clamp(34px,9vmin,78px);letter-spacing:.06em;color:#8dffa0;text-shadow:0 0 18px #2dd85a,4px 4px 0 #4a1c8c}
#menu p{margin:0;max-width:640px;color:#c7b8e6;font-size:clamp(14px,3vmin,22px);line-height:1.4}
#menu small{color:#7d6e9c;font-size:clamp(11px,2.2vmin,15px)}
.mb{min-width:min(300px,70vw);padding:12px 26px;font:bold clamp(18px,3.6vmin,28px) "Palatino Linotype",Georgia,serif;color:#e7ffe9;background:#1d0f36;border:2px solid #a35cff;border-radius:6px;box-shadow:0 0 16px rgba(163,92,255,.5),inset 0 0 14px rgba(77,255,122,.15);touch-action:manipulation}
.mb:active{background:#3b1a6b;border-color:#4dff7a}
#menu{overflow-y:auto}
#menu>:first-child{margin-top:auto}#menu>:last-child{margin-bottom:auto}
.mb.sm{min-width:0;padding:8px 14px;font-size:clamp(13px,2.6vmin,19px)}
.mb.sel{border-color:#4dff7a;background:#12361f;box-shadow:0 0 18px rgba(77,255,122,.55),inset 0 0 14px rgba(77,255,122,.25)}

.cc{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:560px}
.opt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

</head>
<body>
<canvas id="g"></canvas>
<div class="pad dp"><div class="b" data-k="left">&lt;</div><div class="b" data-k="right">&gt;</div><div class="b" data-k="down">v</div></div>
<div class="pad ac"><div class="b v" data-k="jump">JUMP</div><div class="b" data-k="slash">SLASH</div><div class="b v" data-k="dash">DASH</div><div class="b" data-k="magic">MAGIC</div></div>
<button id="pz">II</button>
<div id="menu"></div>
<script>
(()=>{
'use strict';
/* ================= CORE ================= */
const W=960,H=540,FLOOR=480,LEN=4000,AX0=3040,AX1=4000,MAXHP=800;
const cv=document.getElementById('g'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',resize);resize();
const GR='#4dff7a',GL='#9dffb5',PU='#a35cff',PD='#3a1f66';

/* ================= LEVEL DATA ================= */
const SEG=[[0,820],[960,1620],[1760,2380],[2500,LEN]];
const PLATS=[[200,392,140],[420,330,150],[640,392,120],[850,405,80],[1040,392,150],[1250,330,150],[1330,262,120],[1450,392,130],
 [1820,392,140],[2030,330,160],[2100,262,120],[2240,392,100],[2400,405,80],[2580,392,150],[2790,330,140],[2900,262,110],
 [3110,392,170],[3760,392,170],[3435,345,170],[3230,262,150],[3660,262,150]].map(([x,y,w])=>({x,y,w}));
const CPS=[1010,1900,2960];
const BRAZ=[60,700,1100,1560,1850,2300,2700,3100,3900];
const SPAWN=[['skel',500,380,780],['cultist',690,690,690,392],['spider',1100,1000,1600],['wisp',1300,1300,1300,300],['golem',1500,1250,1600],
 ['skel',1880,1780,2350],['cultist',2100,2100,2100,330],['wisp',2230,2230,2230,320],['spider',2300,1780,2370],['golem',2650,2520,3000],['skel',2800,2520,3000]];

/* ---------- themes, skins & hero sprite ---------- */
const THEMES=[
 {id:'cyan',name:'CYAN / VIOLET',a:'#4dffe0',b:'#b36bff',a2:'#2a9fb0',b2:'#7a3de0',dark:'#17808a',rgbA:'77,255,224',rgbB:'163,92,255',ghost:'rgba(60,240,255,.8)'},
 {id:'toxic',name:'TOXIC EMERALD',a:'#9dff4a',b:'#2dd85a',a2:'#4a9a20',b2:'#1a7a3a',dark:'#2a6a14',rgbA:'157,255,74',rgbB:'45,216,90',ghost:'rgba(140,255,60,.8)'},
 {id:'crimson',name:'CRIMSON BLOOD',a:'#ff3355',b:'#ff7a96',a2:'#8a1030',b2:'#a02048',dark:'#6a1020',rgbA:'255,51,85',rgbB:'255,122,150',ghost:'rgba(255,60,90,.8)'},
 {id:'gold',name:'ARCANE GOLD',a:'#ffd75a',b:'#ff9a2d',a2:'#a07a18',b2:'#a05010',dark:'#8a6a10',rgbA:'255,215,90',rgbB:'255,154,45',ghost:'rgba(255,200,70,.8)'}];
const SKINS=[{id:'default',name:'DEFAULT'},{id:'shadow',name:'SHADOW / VOID',lo:[8,4,16],hi:[150,120,235]},{id:'emerald',name:'EMERALD / ARCANE',lo:[3,22,12],hi:[125,255,176]},{id:'custom',name:'CUSTOM'}];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
let TH=THEMES.find(t=>t.id===lsGet('warden_theme'))||THEMES[0],skinId=(SKINS.find(s=>s.id===lsGet('warden_skin'))||SKINS[0]).id;
const baseSheet=mk(512,512),sheet=mk(512,512),tint=mk(512,512);let spriteReady=false,baseOK=false,customBase=null,PV=null,PVon=false;
function keyMagenta(x){const d=x.getImageData(0,0,512,512),p=d.data;for(let i=0;i<p.length;i+=4)if(p[i]>180&&p[i+1]<70&&p[i+2]>180)p[i+3]=0;x.putImageData(d,0,0)}
function rebuildTint(){const t=tint.getContext('2d');t.globalCompositeOperation='source-over';t.clearRect(0,0,512,512);t.drawImage(sheet,0,0);t.globalCompositeOperation='source-atop';t.fillStyle=TH.ghost;t.fillRect(0,0,512,512);t.globalCompositeOperation='source-over'}
function applySkin(){
 const useC=skinId==='custom'&&customBase;if(!baseOK&&!useC){spriteReady=false;return}
 try{const c=sheet.getContext('2d'),sk=SKINS.find(s=>s.id===skinId);c.clearRect(0,0,512,512);c.drawImage(useC?customBase:baseSheet,0,0);
  if(sk&&sk.lo&&!useC){const d=c.getImageData(0,0,512,512),p=d.data,lo=sk.lo,hi=sk.hi;for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const k=Math.pow((.3*p[i]+.59*p[i+1]+.11*p[i+2])/255,.85);p[i]=lo[0]+(hi[0]-lo[0])*k;p[i+1]=lo[1]+(hi[1]-lo[1])*k;p[i+2]=lo[2]+(hi[2]-lo[2])*k}c.putImageData(d,0,0)}
  spriteReady=true;rebuildTint()}catch(_){spriteReady=false}}
function setSkin(id){skinId=id;lsSet('warden_skin',id);applySkin()}
function setTheme(id){TH=THEMES.find(t=>t.id===id)||THEMES[0];lsSet('warden_theme',TH.id);if(spriteReady)rebuildTint()}
{const img=new Image();img.onload=()=>{try{const c=baseSheet.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(img,0,0,512,512);keyMagenta(c);baseOK=true;applySkin()}catch(_){baseOK=false}};img.onerror=()=>{};img.src='CharacterH.png'}
{const cd=lsGet('warden_custom');if(cd){const im=new Image();im.onload=()=>{try{const c=mk(512,512),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(im,0,0,512,512);keyMagenta(x);customBase=c;if(skinId==='custom')applySkin()}catch(_){}};im.src=cd}}
/* procedural hero used when no sprite sheet is available */
function heroProc(c,x,y,face,row,fr,sx,sy,al,tinted){
 const pal=tinted?[TH.a,TH.a,'#fff']:skinId==='emerald'?['#06281a','#1f7a4a','#7dffb0']:skinId==='shadow'?['#08040f','#2a1a4a','#8a6adf']:['#1a1030','#4a2a8a','#7ab8ff'];
 const bob=row===1?Math.sin(fr*1.6):0,st=row===0&&fr%2?2:0;
 c.save();c.translate(Math.round(x),Math.round(y));c.scale(face*sx,sy);c.globalAlpha=al;
 c.fillStyle=pal[0];c.fillRect(-11,-46+bob,22,46);c.fillStyle=pal[1];c.fillRect(-11,-46+bob,3,46);for(let i=-10;i<11;i+=5)c.fillRect(i,-2,3,2+(i&3));
 c.fillStyle=pal[0];c.fillRect(-9,-64+bob,18,20);c.fillRect(-5,-70+bob,10,7);c.fillStyle=pal[1];c.fillRect(-9,-64+bob,2,20);
 c.fillStyle='#030208';c.fillRect(-4,-58+bob,12,10);c.fillStyle=pal[2];c.fillRect(-2,-55+bob,3,2);c.fillRect(3,-55+bob,3,2);
 if(row===2){c.fillStyle=pal[2];c.fillRect(12,-50+fr*3,3,30);c.fillRect(10,-22+fr*3,7,3);c.globalAlpha=al*.4;c.fillRect(11,-52+fr*3,5,34);c.globalAlpha=al}
 else if(row===3){c.fillStyle=pal[2];c.fillRect(11,-36,5,5);c.globalAlpha=al*.35;c.beginPath();c.arc(14,-34,9+fr*2,0,7);c.fill();c.globalAlpha=al}
 c.fillStyle=tinted?TH.a:'#4dffe0';c.fillRect(-26,-12+st,12,7);c.fillRect(-30,-18+st,7,6);c.fillRect(-30,-22+st,2,4);c.fillRect(-25,-22+st,2,4);c.fillStyle='#fff';c.fillRect(-29,-16+st,2,2);
 c.restore()}
function heroTo(c,x,y,face,row,fr,sx,sy,alpha,tinted){
 if(spriteReady){c.save();c.translate(Math.round(x),Math.round(y));c.scale(face*sx,sy);c.globalAlpha=alpha;c.imageSmoothingEnabled=false;c.drawImage(tinted?tint:sheet,fr*128,row*128,128,128,-52,-98,104,104);c.restore()}
 else heroProc(c,x,y,face,row,fr,sx,sy,alpha,tinted)}
const drawHero=(...a)=>heroTo(ctx,...a);

/* ---------- PNG-first art assets (each falls back to procedural drawing) ---------- */
/* key:[file, columns, rows]  (frames laid out left->right, top->bottom; sprites face RIGHT) */
const ART={boss:['Warden.png',5,2],skel:['Enemy_Skeleton.png',4,1],cultist:['Enemy_Cultist.png',4,1],golem:['Enemy_Golem.png',4,1],wisp:['Enemy_Wisp.png',4,1],spider:['Enemy_Spider.png',4,1],
 slash:['Fx_Slash.png',3,1],bolt:['Fx_Bolt.png',1,1],wave:['Fx_Wave.png',1,1],skull:['Fx_Skull.png',1,1],orb:['Fx_Orb.png',1,1],rift:['Fx_Rift.png',1,1],pick:['Prop_Heart.png',1,1],
 brazier:['Prop_Brazier.png',4,1],cp:['Prop_Checkpoint.png',2,1],gate:['Prop_Gate.png',1,1],
 tFloor:['Tile_Floor.png',1,1],tPlat:['Tile_Platform.png',1,1],tBanner:['Prop_Banner.png',1,1],tCage:['Prop_Cage.png',1,1],tLantern:['Prop_Lantern.png',1,1],tFar:['Tile_Background.png',1,1]};
const ASSETS={};
const isOK=k=>{const a=ASSETS[k];return !!(a&&a.ok)};
function keyBG(x,w,h,dark){const d=x.getImageData(0,0,w,h),p=d.data;if(p[3]<250)return;const r0=p[0],g0=p[1],b0=p[2];let m=0;if(r0>160&&b0>160&&g0<220)m=1;else if(dark&&r0<16&&g0<16&&b0<20)m=2;if(!m)return;
 for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];if(m===1?(r>160&&b>160&&g<225&&!(r>215&&g>215&&b>215)):(r<14&&g<14&&b<18))p[i+3]=0}x.putImageData(d,0,0)}
Object.entries(ART).forEach(([k,[f,cols,rows]])=>{const a={ok:false,cv:null,cols,rows,fw:0,fh:0,tc:{}};ASSETS[k]=a;const im=new Image();
 im.onload=()=>{try{const w=im.width,h=im.height,c=mk(w,h),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(im,0,0);keyBG(x,w,h,k[0]!=='t');a.cv=c;a.fw=w/cols;a.fh=h/rows;a.ok=true;if(k[0]==='t')scheduleRebuild()}catch(_){a.ok=false}};
 im.onerror=()=>{};im.src=f});
function drawArt(a,i,dx,dy,dw,dh,src){const n=a.cols*a.rows;i=((Math.floor(i)%n)+n)%n;ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(src||a.cv,(i%a.cols)*a.fw,Math.floor(i/a.cols)*a.fh,a.fw,a.fh,dx,dy,dw,dh);ctx.restore()}
function artFlash(a){if(!a.fcv){const c=mk(a.cv.width,a.cv.height),x=c.getContext('2d');x.drawImage(a.cv,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(255,255,255,.85)';x.fillRect(0,0,c.width,c.height);a.fcv=c}return a.fcv}
function fxSrc(a){if(TH.id==='cyan')return a.cv;const k=TH.id;if(!a.tc[k]){const c=mk(a.cv.width,a.cv.height),x=c.getContext('2d');x.drawImage(a.cv,0,0);x.globalCompositeOperation='source-atop';x.fillStyle=TH.ghost;x.fillRect(0,0,c.width,c.height);a.tc[k]=c}return a.tc[k]}
function drawSlashPNG(f){const A=ASSETS.slash,p=f.t/f.dur,R=(60+8*f.step)*2.2,h=R*A.fh/A.fw;ctx.save();ctx.translate(f.x+f.dir*18,f.y);ctx.scale(f.dir,1);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1-p;drawArt(A,f.step-1,-R*.1,-h/2,R,h,fxSrc(A));ctx.restore()}
function drawEnemyPNG(e,A){const T=ET[e.t],t=G.time+e.ph,dh=T.h*1.3,dw=dh*A.fw/A.fh;
 ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));
 if(e.t!=='wisp'){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,1,T.w*.55,4,0,0,7);ctx.fill()}
 ctx.scale(e.face,1);drawArt(A,t*8,-dw/2,e.t==='wisp'?-dh*.95:-dh,dw,dh,e.flash>0?artFlash(A):A.cv);
 if(e.t==='cultist'&&e.st==='wind')glowL(16,-34,26,GR,.6);if(e.t==='wisp')glowL(0,-18,34,GR,.35);ctx.restore()}
function bossFrame(){
 if(B.dead)return 9;
 if(B.st==='tp')return 8;
 if(B.st==='summon')return B.t>1.4?7:0;
 if(B.st==='tele')return B.atk==='slash'?3:2;
 if(B.st==='act'){
  if(B.atk==='slash'||B.atk==='flail')return 4;
  if(B.atk==='summon')return 7;
  return 2;
 }
 return Math.floor(G.time*4)%2===0?0:5;
}

/* ---------- static art: far cavern + level ---------- */
const far=mk(Math.round(LEN*.35)+W,H),lvl=mk(LEN,H),vig=mk(W,H);
const hash=(x,y)=>{let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
function stone(c,x0,y0,w,h,o){o=o||{};const A=o.png&&ASSETS[o.png];if(A&&A.ok){c.save();c.imageSmoothingEnabled=false;if(o.stretch)c.drawImage(A.cv,0,0,A.cv.width,A.cv.height,x0,y0,w,h);else{c.translate(x0,y0);c.fillStyle=c.createPattern(A.cv,'repeat');c.fillRect(0,0,w,h)}c.restore();return}const bh=o.bh||16,bw=o.bw||40,tone=o.tone||0;
 for(let y=0,row=0;y<h;y+=bh,row++){const hh=Math.min(bh,h-y);
  for(let x=-((row&1)*(bw/2));x<w;x+=bw){const bx=Math.max(0,x),ww=Math.min(x+bw,w)-bx;if(ww<=0)continue;
   const v=hash(x0+x,y0+y),l=Math.round(24+v*10+tone);
   c.fillStyle=`rgb(${l},${l-7},${l+16})`;c.fillRect(x0+bx,y0+y,ww,hh);
   c.fillStyle='rgba(150,120,220,.22)';c.fillRect(x0+bx,y0+y,ww,1);
   c.fillStyle='rgba(0,0,0,.4)';c.fillRect(x0+bx,y0+y+hh-1,ww,1);c.fillRect(x0+bx+ww-1,y0+y,1,hh);
   c.fillStyle='rgba(0,0,0,.16)';c.fillRect(x0+bx+ww-3,y0+y+1,2,hh-2);
   for(let k=0;k<3;k++){const n=hash(x0+bx+k*13,y0+y+k*7);if(n>.55){c.fillStyle=n>.8?'rgba(170,150,230,.14)':'rgba(0,0,0,.3)';c.fillRect(x0+bx+2+((n*977)%Math.max(1,ww-5)|0),y0+y+2+((n*313)%Math.max(1,hh-4)|0),2+((n*7|0)%3),1)}}
   if(hash(x0+bx,y0+y+99)>.93){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(x0+bx+4,y0+y+3,1,Math.max(1,hh-6));c.fillRect(x0+bx+5,y0+y+hh-5,3,1)}}}}
function moss(c,x,y,w,d){for(let i=0;i<w;i+=2){const n=hash(x+i,y);if(n<d){const hh=2+(hash(i,x)*5|0);c.fillStyle='#17482a';c.fillRect(x+i,y-hh,2,hh+2);c.fillStyle='#2d8a3e';c.fillRect(x+i,y-hh,2,Math.max(1,hh-1));if(hash(i,y+3)>.75){c.fillStyle=GR;c.fillRect(x+i,y-hh,2,1)}
  if(n<d*.22){const L=5+(hash(x,i)*12|0);c.fillStyle='#2d8a3e';c.fillRect(x+i,y+2,1,L);c.fillStyle=GR;c.fillRect(x+i,y+2+L,1,1)}}}}
function rune(c,x,y,col,a,s){s=s||1;c.save();c.globalAlpha=a||1;c.fillStyle=col;c.fillRect(x-s,y-5*s,2*s,10*s);c.fillRect(x-4*s,y-s,8*s,2*s);c.fillRect(x-3*s,y-4*s,2*s,2*s);c.fillRect(x+s,y+2*s,2*s,2*s);c.globalAlpha=(a||1)*.2;c.beginPath();c.arc(x,y,9*s,0,7);c.fill();c.restore()}
function chainV(c,x,y0,y1){for(let y=y0,i=0;y<y1;y+=6,i++){if(i&1){c.fillStyle='#5b5078';c.fillRect(x-1,y,2,6);c.fillStyle='#2a2240';c.fillRect(x,y,1,6)}else{c.fillStyle='#4a4068';c.fillRect(x-3,y,6,6);c.fillStyle='#0a0612';c.fillRect(x-1,y+1,2,4);c.fillStyle='#8a80b0';c.fillRect(x-3,y,6,1)}}}

 case'tele':B.face=P.x<B.x?-1:1;if(B.t<=0){B.st='act';B.n=0;B.nt=0;B.t=B.atk==='flail'?1.5:B.atk==='pillars'?.6:1;B.ang=0}break;

 for(let i=RIFTS.length-1;i>=0;i--){const r=RIFTS[i];r.t+=dt;if(r.t>=r.warn&&r.t<r.warn+r.fire&&Math.abs(P.x-r.x)<36)hurt(2,r.x);
